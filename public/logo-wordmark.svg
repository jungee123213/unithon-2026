  <style>
    /* 원본은 Arial Black 이다. 없는 환경(리눅스·일부 안드로이드)에서 자간이 무너지지
       않도록 굵기를 명시한 폴백을 붙인다. */
    .w { fill: currentColor; font-family: 'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 900; }
    .t { fill: currentColor; font-family: 'Tamil Sangam MN', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 700; }
    .b { fill: none; stroke: currentColor; stroke-miterlimit: 10; stroke-width: 5px; }
  </style>
  <text class="w" transform="translate(225.1 699.73)"><tspan x="0" y="0">no meeting</tspan></text>
  <text class="w" transform="translate(304.09 685.01)"><tspan x="0" y="0">_________</tspan></text>
