<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 개정 로고에는 심볼 마크가 없다. 32px 탭에서 박스 워드마크 전체는 못 읽으므로
       박스 안 "no" 만 잘라 정사각으로 다시 짠다. 획 두께는 원본 비율(5/60.1)을 따랐다.
       파비콘은 브라우저 탭 배경 위에 얹히니 다크 테마에서 사라지지 않게 뒤집는다. -->
  <style>
    svg { color: #231815; }
    @media (prefers-color-scheme: dark) { svg { color: #f2efe9; } }
    .b { fill: none; stroke: currentColor; stroke-miterlimit: 10; stroke-width: 5px; }
    .w { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; }
  </style>
  <rect class="b" x="4.5" y="4.5" width="55" height="55"/>
  <text class="w" x="32" y="41" text-anchor="middle">no</text>
</svg>
